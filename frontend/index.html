<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Buscacupos UC</title>
  

  <style>
    body {
      font-family: "Segoe UI", Roboto, sans-serif;
      background: #f6f8fa;
      color: #222;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .container {
      background: white;
      padding: 2rem;
      margin-top: 3rem;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 500px;
    }

    h1 {
      text-align: center;
      color: #333;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    input[type="email"],
    input[type="datetime-local"],
    input[type="text"] {
      width: 100%;
      padding: 0.5rem;
      border-radius: 6px;
      border: 1px solid #ccc;
      margin-bottom: 1rem;
      font-size: 1rem;
    }

    button {
      padding: 0.6rem 1rem;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    #addNrcBtn {
      background-color: #2d7ff9;
      color: white;
      margin-bottom: 1rem;
    }

    #addNrcBtn:disabled {
      background-color: #a7c2f9;
      cursor: not-allowed;
    }

    #submitBtn {
      background-color: #28a745;
      color: white;
      width: 100%;
      margin-top: 0.5rem;
    }

    #result {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 6px;
      background: #f1f3f6;
      font-family: monospace;
      white-space: pre-wrap;
    }

    .error {
      color: crimson;
    }

    .nrc-item {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .remove-btn {
      background: #dc3545;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 0.3rem 0.6rem;
      cursor: pointer;
    }

    .remove-btn:hover {
      background: #b02a37;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>BuscacuposUC</h1>
    <h2>Programa el envío de correos con la información actualizada sobre tus cupos</h2>

    <button type="button" onclick="window.location.href='busqueda.html'">
    Busca el NRC de tu curso
    </button>
    <br>
    <br>


    <form id="scheduleForm">
      <label>Correo destinatario:</label>
      <input type="email" id="to" name="to" required />
      <br>
      <label>Selecciona horario(s) de envío:</label>

      <div class="horarios">
        <label>
          <input type="checkbox" name="horarios" value="07:50"> 7:50
        </label>
        <label>
          <input type="checkbox" name="horarios" value="9:20"> 9:20
        </label>
        <label>
          <input type="checkbox" name="horarios" value="10:50"> 10:50
        </label>
        <label>
          <input type="checkbox" name="horarios" value="12:20"> 12:20
        </label>
        <label>
          <input type="checkbox" name="horarios" value="13:50"> 13:50
        </label>
        <label>
          <input type="checkbox" name="horarios" value="15:20"> 15:20
        </label>
        <label>
          <input type="checkbox" name="horarios" value="16:50"> 16:50
        </label>
                </label>
                <label>
          <input type="checkbox" name="horarios" value="18:20"> 18:20
        </label>
      </div>
      <br>


      <label>NRC(s) del curso:</label>
        <div id="nrcContainer">
          <div class="nrc-item"><input type="text" class="nrcInput" placeholder="Ej: 13747" required /></div>
          <div class="nrc-item"><input type="text" class="nrcInput" placeholder="opcional"  /></div>
          <div class="nrc-item"><input type="text" class="nrcInput" placeholder="opcional"  /></div>
          <div class="nrc-item"><input type="text" class="nrcInput" placeholder="opcional"  /></div>
          <div class="nrc-item"><input type="text" class="nrcInput" placeholder="opcional"  /></div>
          <div class="nrc-item"><input type="text" class="nrcInput" placeholder="opcional"  /></div>
          <div class="nrc-item"><input type="text" class="nrcInput" placeholder="opcional"  /></div>
          <div class="nrc-item"><input type="text" class="nrcInput" placeholder="opcional"  /></div>
          <div class="nrc-item"><input type="text" class="nrcInput" placeholder="opcional"  /></div>
        </div>



      <button type="submit" id="submitBtn"> Programar correo</button>
    </form>

    <div id="result" aria-live="polite"></div>
  </div>

  <script>
    const form = document.getElementById('scheduleForm');
    const nrcContainer = document.getElementById('nrcContainer');
    //const addNrcBtn = document.getElementById('addNrcBtn');
    const resultDiv = document.getElementById('result');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const to = document.getElementById('to').value.trim();
      //const dateTime = document.getElementById('dateTime').value;
      const nrcInputs = document.querySelectorAll('.nrcInput');
      const nrcList = Array.from(nrcInputs)
        .map(input => input.value.trim())
        .filter(n => n !== "");

      const horarios = Array.from(
      document.querySelectorAll('input[name="horarios"]:checked')
      ).map(h => h.value);

      if (!to || horarios.length === 0 || nrcList.length === 0) {
        show("Faltan datos", true);
        return;
      }





      show(" Enviando petición...");

      const payload = { to, horarios, nrcList };

      try {
        const res = await fetch('/backend/schedule2', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        const text = await res.text();
        let parsed;
        try { parsed = JSON.parse(text); } catch {}

        if (res.ok) {
          show("Correo programado exitosamente\n");
        } else {
          show("Error enviando petición, contactese con el equipo\n");
        }
      } catch (err) {
        show("Error de red o interno, compruebe su conexión a internet\n" + err.toString(), true);
      }
    });

    function show(msg, isError = false) {
      resultDiv.textContent = msg;
      resultDiv.className = isError ? "error" : "";
    }


  window.addEventListener("DOMContentLoaded", () => {
  const data = sessionStorage.getItem("nrc_importados");
  if (!data) return;

  const nrcs = JSON.parse(data);

  const inputs = document.querySelectorAll(".nrcInput");

  
  inputs.forEach((input, i) => {
    input.value = nrcs[i] || ""; 
  });
});


  </script>

  <script>
const checkboxes = document.querySelectorAll('input[name="horarios"]');

checkboxes.forEach(cb => {
  cb.addEventListener('change', () => {
    const seleccionados = document.querySelectorAll('input[name="horarios"]:checked');

    if (seleccionados.length > 2) {
      cb.checked = false; // desmarca el último
      alert("Solo puedes seleccionar un máximo de 2 horarios.");
    }
  });
});
</script>

</body>
</html>
