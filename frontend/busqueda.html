<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Buscacupos UC</title>
  

  <style>
    body {
      font-family: "Segoe UI", Roboto, sans-serif;
      background: #f6f8fa;
      color: #222;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .container {
      background: white;
      padding: 2rem;
      margin-top: 3rem;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 90%;

    }

    h1 {
      text-align: center;
      color: #333;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      max-width: 300px;
    }

    input {
  max-width: 300px;
}


    input[type="email"],
    input[type="nombre"],
    input[type="sigla"],
    input[type="datetime-local"],
    input[type="text"] {
      width: 100%;
      padding: 0.5rem;
      border-radius: 6px;
      border: 1px solid #ccc;
      margin-bottom: 1rem;
      font-size: 1rem;
    }

    button {
      padding: 0.6rem 1rem;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      max-width: 300px;
    }

    #addNrcBtn {
      background-color: #2d7ff9;
      color: white;
      margin-bottom: 1rem;
    }

    #addNrcBtn:disabled {
      background-color: #a7c2f9;
      cursor: not-allowed;
    }

    #submitBtn {
      background-color: #28a745;
      color: white;
      width: 100%;
      margin-top: 0.5rem;
    }

    #result {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 6px;
      background: #f1f3f6;
      font-family: monospace;
      white-space: pre-wrap;
    }

    .error {
      color: crimson;
    }

    .nrc-item {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .remove-btn {
      background: #dc3545;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 0.3rem 0.6rem;
      cursor: pointer;
    }

    .remove-btn:hover {
      background: #b02a37;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>BuscacuposUC</h1>
    <h2>Programa el envío de correos con la información actualizada sobre tus cupos</h2>

    <button type="button" onclick="window.location.href='index.html'">
    Volver
    </button>
    <br>
    <br>


    <form id="scheduleForm">
      <label>Nombre del curso:</label>
      <input type="text" id="nombre" name="courseName"  />

      <label>Sigla del cuso:</label>
      <input type="text"  id="sigla" name="courseSigla"  />
       <br>
      <button type="submit" id="submitBtn"> + Buscar cursos que coincidan</button>
    </form>

    <div id="result" aria-live="polite"></div>
        <iframe id="preview" 
                style="width:100%; height:600px; border:1px solid #ddd; margin-top:20px;">
        </iframe>
    </div>

  <script>
  const form = document.getElementById("scheduleForm");
  const nombreInput = document.getElementById("nombre");
  const siglaInput = document.getElementById("sigla");
  const iframe = document.getElementById("preview");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const nombre = nombreInput.value.trim();
    const sigla = siglaInput.value.trim();

    if (!nombre && !sigla) {
      iframe.contentDocument.body.innerHTML = "<p style='color:red;'>Debes ingresar nombre O sigla</p>";
      return;
    }

    //console.log("aaaaaaaaaaaaaaa")
    //const url = `https://buscacursos.uc.cl/?cxml_semestre=2025-2&cxml_sigla=${encodeURIComponent(sigla)}&cxml_nombre=${encodeURIComponent(nombre)}&cxml_nrc=`;

    try {
      const url = `/api/buscacursos?sigla=${encodeURIComponent(sigla)}&nombre=${encodeURIComponent(nombre)}`;

        const res = await fetch(url);
        const html = await res.text();

        iframe.srcdoc = html;


      // 👉 Mostrar el HTML dentro del iframe
      //iframe.srcdoc = html;

    } catch (err) {
      iframe.contentDocument.body.innerHTML = "<p style='color:red;'>Error realizando GET</p>";
    }
  });
</script>


</body>
</html>
